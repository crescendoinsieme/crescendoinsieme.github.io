name: publish-beta
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica la beta
        run: |
          curl -fsSL 'https://customer-assets-lxgj4vgw.emergentagent.net/wingman/cdbd50c9-581d-4950-a529-c2128041e321/attachments/b5430c67ecdb461b8022a09b000f57d2_crescendo-beta-prova.html' -o index.html
          grep -q 'Crescendo Insieme' index.html
          touch .nojekyll
      - name: Commit
        run: |
          git config user.name 'crescendo-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add index.html .nojekyll
          git commit -m 'Beta online' || echo nothing
          git push
